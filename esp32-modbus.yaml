esp32:
  board: esp32dev
  framework:
    type: arduino

esphome:
  name: esp32-modbus
  friendly_name: esp32-modbus
  on_boot:
    priority: 200
    then:
      - script.execute: on_boot

# Enable logging
logger:
  logs:
    modbus_controller.sensor: WARN
    modbus_controller.output: WARN
    modbus.number: WARN
    esp32.preferences: WARN
    sensor: WARN
    text_sensor: WARN
    dht.sensor: WARN
    switch: WARN
    button: WARN
    number: WARN

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp32-Modbus Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

time:
  - platform: sntp
    id: brink_sntp_time
    timezone: "Europe/Paris"
    on_time_sync:
      then:
        - logger.log: "Synchronized sntp clock"

uart:
  id: mod_bus
  baud_rate: 19200
  stop_bits: 1
  tx_pin: 17
  rx_pin: 16
  parity: even

modbus:
  id: modbus_brink
  send_wait_time: 200ms

modbus_controller:
  - id: brink
    address: 20
    command_throttle: 200ms
    setup_priority: -10
    update_interval: 10s


script:
###  On reboot or powerloss of the esp, set the command to Modbus Step instead of Device LCD
  - id: on_boot
    then:
      - lambda: |-
          auto new_value = 1;

          esphome::modbus_controller::ModbusController *controller = id(brink);
          auto set_value_cmd = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
            controller, 8000, new_value);

          delay(200) ;
          controller->queue_command(set_value_cmd);
          ESP_LOGI("ModbusLambda", "Brink Modbus Step set");

sensor:
  - id: brink_temp_to_inside
    name: ${brink_temp_to_inside}
    platform: modbus_controller
    modbus_controller_id: brink
    address: 4036
    device_class: temperature
    unit_of_measurement: "°C"
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 1
    state_class: measurement
    filters:
      - multiply: 0.1

  - id: brink_humidity_to_inside
    name: ${brink_humidity_to_inside}
    icon: "mdi:water-percent"
    platform: modbus_controller
    modbus_controller_id: brink
    register_type: read
    address: 4037
    device_class: humidity
    unit_of_measurement: "%"
    value_type: U_WORD
    accuracy_decimals: 0
    state_class: measurement

  - id: brink_dewpoint_to_inside
    name: ${brink_dewpoint_to_inside}
    platform: template
    lambda: |-
        return (243.5*(log(id(brink_humidity_to_inside).state/100)+((17.67*id(brink_temp_to_inside).state)/
        (243.5+id(brink_temp_to_inside).state)))/(17.67-log(id(brink_humidity_to_inside).state/100)-
        ((17.67*id(brink_temp_to_inside).state)/(243.5+id(brink_temp_to_inside).state))));
    unit_of_measurement: °C
    update_interval: 15s
    icon: 'mdi:thermometer-water'

  - id: brink_temp_to_outside
    name: ${brink_temp_to_outside}
    platform: modbus_controller
    modbus_controller_id: brink
    address: 4046
    device_class: temperature
