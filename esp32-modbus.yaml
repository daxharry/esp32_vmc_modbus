    name: ${brink_imbalance_intake}
    platform: modbus_controller
    modbus_controller_id: brink
    address: 6035
    unit_of_measurement: "%"
    value_type: S_WORD
    multiply: 10
    min_value: -15
    max_value: 15
    mode: slider
    icon: mdi:home-import-outline

##  BYPASS OPEN
##  ▪ Outdoor temperature is above 10°C (adjustable 7–15°C) AND
##  ▪ outdoor temperature is below the extract (from dwelling) temperature AND
##  ▪ extract temperature is above 24°C (adjustable 15–35°C)

##  BYPASS CLOSED
##  ▪ Outdoor temperature is below 10°C (adjustable 7–15°C) OR
##  ▪ outdoor temperature is above the extract temperature OR
##  ▪ extract temperature is below the setpoint minus hysteresis

  - id: brink_bypass_from_dwelling ## extract air from dwelling, default 24 °C
    name: ${brink_bypass_from_dwelling}
    platform: modbus_controller
    modbus_controller_id: brink
    address: 6101
    device_class: temperature
    unit_of_measurement: "°C"
    value_type: S_WORD
    min_value: 15
    max_value: 35
    step: 0.5
    multiply: 10
    mode: slider
    icon: mdi:home-export-outline

  - id: brink_bypass_from_outside ## outdoor intake air, default 10 °C
    name: ${brink_bypass_from_outside}
    platform: modbus_controller
    modbus_controller_id: brink
    address: 6102
    device_class: temperature
    unit_of_measurement: "°C"
    value_type: S_WORD
    min_value: 7
    max_value: 15
    step: 0.5
    multiply: 10
    mode: slider
    icon: mdi:home-import-outline

  - id: brink_bypass_hysteresis ## default 2 °C
    name: ${brink_bypass_hysteresis}
    platform: modbus_controller
    modbus_controller_id: brink
    address: 6103
    unit_of_measurement: "°C"
    device_class: temperature
    value_type: S_WORD
    min_value: 0
    max_value: 5
    step: 0.5
    multiply: 10
    mode: slider
    icon: mdi:home-edit-outline

### Frost protection
